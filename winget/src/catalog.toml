# Catalogue des logiciels Windows proposés par le wizard (`baluchon-core win catalog`).
#
# Chaque identifiant `winget` a été vérifié le 09/11/2026 contre le dépôt officiel
# microsoft/winget-pkgs (chemin manifests/<lettre>/<Éditeur>/<Paquet>/…). Écarté :
#   - RustDesk.RustDesk : absent du dépôt (aucun dossier manifests/r/RustDesk) ;
#   - KeePassXC.KeePassXC : absent ; le paquet existe sous KeePassXCTeam.KeePassXC.
# Volontairement absent : CCleaner (version gratuite écartée pour sa licence).
#
# Suite ArtCraft (catégorie « ArtCraft », 14 applis, aucune cochée par défaut) : chaque identifiant a été
# revérifié le 26/11/2026 contre les manifestes officiels manifests/a/ArtCraft/<Nom>/ de microsoft/winget-pkgs
# (version courante lue : installateur MSI « wix », portée machine, aucune dépendance déclarée ; un
# identifiant par dossier, PackageIdentifier relu dans chacun). Écartés : ArtCraft.ArtCraft (un IDE
# d'images par IA) et ArtCraft.CraftAnything, qui sont d'AUTRES produits. Le lanceur de la suite n'est
# pas dans winget : il n'est pas proposé ici. Chaque libellé donne le nom, la fonction en clair puis le
# logiciel que la ShortDescription du manifeste officiel dit remplacer, sous une seule forme :
# « Nom (fonction : alternative libre à X) » (MaterialCraft et TextureCraft n'en remplacent aucun).
#
# Surcharge : `<racine>/config/catalog.toml`, même format, fusion PAR CLÉ champ par
# champ (`remove = true` retire une entrée ; une clé nouvelle doit avoir label + winget).
# Les libellés ne contiennent ni virgule (gum --selected sépare par virgule) ni tabulation.
#
# PACKS (`[[pack]]`, en fin de fichier) : une liste nommée de logiciels, jamais recopiée. Un pack a
# `key`, `label` et EXACTEMENT UNE source : `apps = [clés]` (liste explicite), `category = "X"` (toute
# une catégorie) ou `defaults = true` (les entrées `default = true`). Les deux dernières se DÉRIVENT du
# catalogue final, surcharge comprise. Un pack ne cite jamais un pack ; sa clé n'est jamais celle d'une
# appli. Même fusion par clé (`remove = true` retire un pack ; une source donnée par la surcharge
# remplace celle du pack). Une clé citée qui n'existe plus (ou a été retirée par la surcharge) est une
# erreur qui nomme le pack : la surcharge est alors ignorée avec son message.

